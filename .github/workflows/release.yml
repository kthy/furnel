name: Release

on:
  push:
    tags: [ v*.*.* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TARGET: ${{ matrix.job.target }}
        run: rustup toolchain install 1.85 --profile minimal --target "$TARGET" && rustup default 1.85
      - name: Install cross
        if: matrix.job.use-cross
        run: cargo install cross@0.2.5 --locked
      - name: Test
        shell: bash
        env:
          TARGET: ${{ matrix.job.target }}
          USE_CROSS: ${{ matrix.job.use-cross }}
          FLAGS: ${{ matrix.job.flags }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross test --locked --target "$TARGET" $FLAGS
          else
            cargo test --locked --target "$TARGET" $FLAGS
          fi

  release:
    name: Create draft release
    permissions:
      contents: write # needed to create the release
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --generate-notes

  deploy:
    name: Push
    permissions:
      contents: write # needed to upload release assets
    needs: [ release ]
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set RUSTFLAGS env variable
        if: matrix.job.rustflags
        shell: bash
        env:
          RUSTFLAGS_VALUE: ${{ matrix.job.rustflags }}
        run: echo "RUSTFLAGS=$RUSTFLAGS_VALUE" >> $GITHUB_ENV

      - env:
          TARGET: ${{ matrix.job.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET"

      - name: Install cross
        if: matrix.job.use-cross
        run: cargo install cross@0.2.5 --locked

      - name: Build target
        shell: bash
        env:
          TARGET: ${{ matrix.job.target }}
          USE_CROSS: ${{ matrix.job.use-cross }}
          FLAGS: ${{ matrix.job.flags }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --locked --release --target "$TARGET" $FLAGS
          else
            cargo build --locked --release --target "$TARGET" $FLAGS
          fi

      - name: Strip release binary
        if: matrix.job.os != 'windows-latest'
        env:
          TARGET: ${{ matrix.job.target }}
        run: |
          strip "target/$TARGET/release/furnel"

      - name: Generate man page
        if: matrix.job.os == 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.job.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends help2man
          doc/mkman.sh "target/$TARGET/release/furnel"

      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5 # v2

      - name: Package
        shell: bash
        env:
          JOB_OS: ${{ matrix.job.os }}
          JOB_TARGET: ${{ matrix.job.target }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if [ "$JOB_OS" = "windows-latest" ]; then
            bin="target/$JOB_TARGET/release/furnel.exe"
          else
            bin="target/$JOB_TARGET/release/furnel"
          fi
          staging="furnel-$VERSION-$JOB_TARGET"

          mkdir "$staging"
          cp CHANGELOG.md LICENSE.md README.md $bin $staging
          if [ -f doc/furnel.1 ]; then
            mkdir "$staging"/doc
            cp doc/furnel.1 "$staging"/doc
          fi

          if [ "$JOB_OS" = "windows-latest" ]; then
            7z a "$staging.zip" $staging
          elif [ "$JOB_OS" = "macos-latest" ]; then
            gtar czvf "$staging.tar.gz" $staging
          else
            tar czvf "$staging.tar.gz" $staging
          fi

      - name: Package (debian)
        if: matrix.job.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          JOB_TARGET: ${{ matrix.job.target }}
        run: |
          cargo install cargo-deb@3.8.0 --locked
          cargo deb --no-build --target "$JOB_TARGET"
          cp "target/$JOB_TARGET/debian"/*.deb ./

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" furnel-*.tar.gz furnel-*.zip furnel*.deb --clobber
